<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AVA-EDUCA+ | Cadastro de Aluno</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="cadastro-aluno.css">
  <link rel="icon" type="image/svg+xml" href="../assets/icons/favicon.svg">
</head>
<body>
  <header class="topbar"><div class="brand-small">AVA-EDUCA+</div><div id="userName" class="user-name"></div></header>
  <div class="app-layout">
    <aside class="sidebar"><nav>
      <a class="nav-link" href="../dashboard/dashboard.html">Dashboard</a>
      <button class="nav-link disabled" disabled>Cursos</button>
      <a class="nav-link active" href="cadastro-aluno.html">Cadastro de Alunos</a>
      <button id="logout" class="nav-link logout" type="button">Sair</button>
    </nav></aside>
    <main class="content">
      <div class="page-heading"><div><h1>Cadastro de Aluno</h1><p>Preencha os dados do novo aluno.</p></div></div>
      <p id="formFeedback" class="feedback" hidden></p>
      <form id="studentForm" class="student-form" novalidate>
        <div class="form-grid">
          <div class="field full"><label for="nome">Nome Completo</label><input id="nome" maxlength="80" minlength="4" required></div>
          <div class="field"><label for="genero">Gênero</label><select id="genero" required><option value="">Selecione</option><option>Masculino</option><option>Feminino</option><option>Outro</option><option>Prefiro não informar</option></select></div>
          <div class="field"><label for="dataNascimento">Data de Nascimento</label><input id="dataNascimento" placeholder="DD/MM/YYYY" required></div>
          <div class="field"><label for="cpf">CPF</label><input id="cpf" inputmode="numeric" required></div>
          <div class="field"><label for="telefone">Telefone</label><input id="telefone" inputmode="tel" required></div>
          <div class="field"><label for="email">E-mail</label><input id="email" type="email" required></div>
          <div class="field"><label for="cep">CEP</label><input id="cep" inputmode="numeric" placeholder="00000-000" required></div>
          <div class="field"><label for="cidade">Cidade</label><input id="cidade" required></div>
          <div class="field"><label for="estado">Estado</label><input id="estado" maxlength="2" required></div>
          <div class="field"><label for="logradouro">Logradouro</label><input id="logradouro" required></div>
          <div class="field"><label for="numero">Número</label><input id="numero" inputmode="numeric" required></div>
          <div class="field"><label for="complemento">Complemento</label><input id="complemento"></div>
          <div class="field"><label for="bairro">Bairro</label><input id="bairro" required></div>
        </div>
        <button class="btn btn-primary" type="submit">Salvar</button>
      </form>
    </main>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.30.1/moment.min.js"></script>
  <script type="module" src="cadastro-aluno.js"></script>
</body>
</html>
