<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AVA-EDUCA+ | Login</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="login.css">
    <link rel="icon" type="image/svg+xml" href="../assets/icons/favicon.svg">
</head>
<body class="login-page">
  <main class="login-card">
    <div class="brand">
      <h1>AVA-EDUCA+</h1>
      <p>Ambiente de apoio à equipe pedagógica</p>
    </div>

    <form id="loginForm" novalidate>
      <label for="email">E-mail</label>
      <input id="email" name="email" type="email" placeholder="Seu E-mail" autocomplete="email" required>

      <label for="senha">Senha</label>
      <input id="senha" name="senha" type="password" placeholder="Digite sua senha" autocomplete="current-password" required>

      <p id="loginFeedback" class="feedback" hidden></p>
      <button class="btn btn-primary" type="submit">Entrar</button>
      <button id="resetPassword" class="link-button" type="button">Esqueci minha senha</button>
    </form>

    </main>
  <script type="module" src="login.js"></script>
</body>
</html>
